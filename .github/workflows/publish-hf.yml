name: Publish Hugging Face
on:
  workflow_dispatch:
    inputs:
      target:
        description: Repository to publish
        type: choice
        options: [both, space, model]
        default: both
permissions:
  contents: read
concurrency:
  group: huggingface-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install huggingface_hub==1.9.2 python-dotenv==1.1.1
      - name: Publish current deploy folders
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_MODEL_REPO_ID: ${{ vars.HF_MODEL_REPO_ID || 'Vaibhavsh0120/ATM-Theft-Detection' }}
          HF_SPACE_REPO_ID: ${{ vars.HF_SPACE_REPO_ID || 'Vaibhavsh0120/ATM-Theft-Detection' }}
          TARGET: ${{ inputs.target }}
        run: |
          test -n "$HF_TOKEN" || { echo 'Add the HF_TOKEN repository secret with write access.'; exit 1; }
          python scripts/push_hf.py --target "$TARGET" --bundle-space-model
