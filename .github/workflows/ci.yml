name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            deploy/huggingface-space/requirements.txt
            training/requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r deploy/huggingface-space/requirements.txt -r training/requirements.txt -r requirements-dev.txt
      - name: Lint and compile
        run: |
          ruff check .
          python -m compileall -q scripts training/scripts deploy/huggingface-space
      - name: Regression and checkpoint smoke tests
        run: pytest -q
      - name: Import standalone Space at its production path
        run: |
          sudo mkdir -p /app
          sudo chown "$USER" /app
          cp -a deploy/huggingface-space/. /app/
          cd /app
          python -c "import app; assert app.resolve_model_path().is_file(); assert app.load_model().names[0] == 'Face_Covered'"
